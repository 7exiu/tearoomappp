components:
- components:
  - name: profile_photo
    properties:
      height: 150
      width: 150
      border_radius: 75
      border: 3
      border_color: '#8b7355'
    type: Image
    layout_properties: {align: center, margin: 20}
  
  - name: user_name
    properties:
      font_size: 24
      bold: true
      foreground: '#8b7355'
      font_family: Playfair Display
      align: center
    type: Label
    layout_properties: {margin: 10}
  
  - name: user_email
    properties:
      font_size: 16
      foreground: '#666666'
      font_family: Quicksand
      align: center
    type: Label
    layout_properties: {margin: 10}
  
  - components:
    - name: edit_button
      properties:
        text: "Modifier le profil"
        background: '#8b7355'
        foreground: '#FFFFFF'
        border_radius: 8
        font_family: Quicksand
        font_size: 16
        bold: true
        hover_background: '#7a6448'
      type: Button
      event_bindings: {click: edit_button_click}
    
    - name: save_button
      properties:
        text: "Enregistrer"
        background: '#8b7355'
        foreground: '#FFFFFF'
        border_radius: 8
        font_family: Quicksand
        font_size: 16
        bold: true
        hover_background: '#7a6448'
        visible: false
      type: Button
      event_bindings: {click: save_button_click}
    
    - name: cancel_button
      properties:
        text: "Annuler"
        background: '#BA1A1A'
        foreground: '#FFFFFF'
        border_radius: 8
        font_family: Quicksand
        font_size: 16
        bold: true
        hover_background: '#A01515'
        visible: false
      type: Button
      event_bindings: {click: cancel_button_click}
    
    name: button_panel
    properties:
      spacing: medium
      align: center
    type: FlowPanel
    layout_properties: {margin: 20}
  
  - components:
    - name: firstname_label
      properties:
        text: "Prénom"
        font_size: 16
        bold: true
        foreground: '#8b7355'
        font_family: Quicksand
      type: Label
    
    - name: firstname_input
      properties:
        background: '#FFFFFF'
        border_radius: 8
        font_family: Quicksand
        font_size: 16
        enabled: false
      type: TextBox
    
    - name: lastname_label
      properties:
        text: "Nom"
        font_size: 16
        bold: true
        foreground: '#8b7355'
        font_family: Quicksand
      type: Label
    
    - name: lastname_input
      properties:
        background: '#FFFFFF'
        border_radius: 8
        font_family: Quicksand
        font_size: 16
        enabled: false
      type: TextBox
    
    - name: email_label
      properties:
        text: "Email"
        font_size: 16
        bold: true
        foreground: '#8b7355'
        font_family: Quicksand
      type: Label
    
    - name: email_input
      properties:
        background: '#FFFFFF'
        border_radius: 8
        font_family: Quicksand
        font_size: 16
        enabled: false
      type: TextBox
    
    name: info_panel
    properties:
      spacing: medium
      background: '#FFFFFF'
      border_radius: 8
      padding: 20
      role: card
    type: ColumnPanel
    layout_properties: {margin: 20, width: 400}
  
  name: main_panel
  properties:
    spacing: medium
    background: '#f5f0e6'
    padding: 20
  type: ColumnPanel
  layout_properties: {align: center}

container:
  type: ColumnPanel
  properties:
    background: '#f5f0e6'
is_package: true
