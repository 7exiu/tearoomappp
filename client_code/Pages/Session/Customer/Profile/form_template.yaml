components:
- components:
  - layout_properties: {align: center, margin: 20}
    name: profile_photo
    properties: {border: 3, border_color: '#8b7355', border_radius: 75, height: 150, width: 150}
    type: Image
  - layout_properties: {margin: 10}
    name: user_name
    properties: {align: center, bold: true, font_family: Playfair Display, font_size: 24, foreground: '#8b7355'}
    type: Label
  - layout_properties: {margin: 10}
    name: user_email
    properties: {align: center, font_family: Quicksand, font_size: 16, foreground: '#666666'}
    type: Label
  - components:
    - event_bindings: {click: edit_button_click}
      name: edit_button
      properties: {background: '#8b7355', bold: true, border_radius: 8, font_family: Quicksand, font_size: 16, foreground: '#FFFFFF', hover_background: '#7a6448', text: Modifier le profil}
      type: Button
    - event_bindings: {click: save_button_click}
      name: save_button
      properties: {background: '#8b7355', bold: true, border_radius: 8, font_family: Quicksand, font_size: 16, foreground: '#FFFFFF', hover_background: '#7a6448', text: Enregistrer, visible: false}
      type: Button
    - event_bindings: {click: cancel_button_click}
      name: cancel_button
      properties: {background: '#BA1A1A', bold: true, border_radius: 8, font_family: Quicksand, font_size: 16, foreground: '#FFFFFF', hover_background: '#A01515', text: Annuler, visible: false}
      type: Button
    layout_properties: {margin: 20}
    name: button_panel
    properties: {align: center, spacing: medium}
    type: FlowPanel
  - components:
    - name: firstname_label
      properties: {bold: true, font_family: Quicksand, font_size: 16, foreground: '#8b7355', text: Prénom}
      type: Label
    - name: firstname_input
      properties: {background: '#FFFFFF', border_radius: 8, enabled: false, font_family: Quicksand, font_size: 16}
      type: TextBox
    - name: lastname_label
      properties: {bold: true, font_family: Quicksand, font_size: 16, foreground: '#8b7355', text: Nom}
      type: Label
    - name: lastname_input
      properties: {background: '#FFFFFF', border_radius: 8, enabled: false, font_family: Quicksand, font_size: 16}
      type: TextBox
    - name: email_label
      properties: {bold: true, font_family: Quicksand, font_size: 16, foreground: '#8b7355', text: Email}
      type: Label
    - name: email_input
      properties: {background: '#FFFFFF', border_radius: 8, enabled: false, font_family: Quicksand, font_size: 16}
      type: TextBox
    layout_properties: {margin: 20, width: 400}
    name: info_panel
    properties: {background: '#FFFFFF', border_radius: 8, padding: 20, role: card, spacing: medium}
    type: ColumnPanel
  layout_properties: {align: center}
  name: main_panel
  properties: {background: '#f5f0e6', padding: 20, spacing: medium}
  type: ColumnPanel
container:
  properties: {background: '#f5f0e6'}
  type: ColumnPanel
is_package: true
