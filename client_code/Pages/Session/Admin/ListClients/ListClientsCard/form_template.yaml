components:
- components:
  - name: profile_photo
    properties: {height: 100, width: 100, border_radius: 50}
    type: Image
    layout_properties: {width: 100}
  
  - name: label_name
    properties: {font_size: 18, bold: true, foreground: '#8b7355'}
    type: Label
    layout_properties: {width: 200}
  
  - name: label_email
    properties: {font_size: 14, foreground: '#666666'}
    type: Label
    layout_properties: {width: 250}
  
  - name: label_role
    properties: {font_size: 14, foreground: '#666666'}
    type: Label
    layout_properties: {width: 100}
  
  - name: desactiver
    properties: 
      text: Désactiver
      background: '#BA1A1A'
      foreground: '#FFFFFF'
      bold: true
    type: Button
    layout_properties: {width: 120}
    event_bindings: {click: desactiver_click}
  
  name: flow_panel_1
  properties: 
    spacing: medium
    align: center
    background: '#FFFFFF'
    border: 1
    border_radius: 8
    role: card
  type: FlowPanel
  layout_properties: {margin: 10}

container:
  type: ColumnPanel
is_package: true
