components:
- components:
  - layout_properties: {width: 100}
    name: profile_photo
    properties: {border_radius: 50, height: 100, width: 100}
    type: Image
  - layout_properties: {width: 200}
    name: label_name
    properties: {bold: true, font_size: 18, foreground: '#8b7355'}
    type: Label
  - layout_properties: {width: 250}
    name: label_email
    properties: {font_size: 14, foreground: '#666666'}
    type: Label
  - layout_properties: {width: 100}
    name: label_role
    properties: {font_size: 14, foreground: '#666666'}
    type: Label
  - event_bindings: {click: desactiver_click}
    layout_properties: {width: 120}
    name: desactiver
    properties: {background: '#BA1A1A', bold: true, foreground: '#FFFFFF', text: Désactiver}
    type: Button
  layout_properties: {margin: 10}
  name: flow_panel_1
  properties: {align: center, background: '#FFFFFF', border: 1, border_radius: 8, role: card, spacing: medium}
  type: FlowPanel
container: {type: ColumnPanel}
is_package: true
