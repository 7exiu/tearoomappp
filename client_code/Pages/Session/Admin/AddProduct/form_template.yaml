components:
- components:
  - layout_properties: {grid_position: 'ESLRYZ,SKAKJY ZLMMZB,WPCLSP'}
    name: image_1
    properties: {}
    type: Image
  - layout_properties: {grid_position: 'ESLRYZ,SKAKJY UJADEO,HWNTXC'}
    name: file_loader_1
    properties: {}
    type: FileLoader
  - layout_properties: {grid_position: 'ESLRYZ,FDQSBY OLTUKS,AECSBB'}
    name: add_pb_name
    properties: 
      placeholder: "Nom du produit"
      background: '#FFFFFF'
      border_radius: 8
      font_family: Quicksand
      font_size: 16
    type: TextBox
  - layout_properties: {grid_position: 'ESLRYZ,FDQSBY KTCIQT,WQUIIH'}
    name: add_price
    properties: 
      placeholder: "Prix"
      background: '#FFFFFF'
      border_radius: 8
      font_family: Quicksand
      font_size: 16
    type: TextBox
  - layout_properties: {grid_position: 'ESLRYZ,FDQSBY UUSKFH,NBBFLB'}
    name: add_description
    properties: 
      placeholder: "Description"
      background: '#FFFFFF'
      border_radius: 8
      font_family: Quicksand
      font_size: 16
    type: TextBox
  - layout_properties: {grid_position: 'ESLRYZ,FDQSBY UUSKFH,NBBFLB'}
    name: category_dropdown
    properties: 
      items: ["Thé", "Goodie"]
      placeholder: "Sélectionnez une catégorie"
      background: '#FFFFFF'
      border_radius: 8
      font_family: Quicksand
      font_size: 16
    type: DropDown
  - event_bindings: {click: add_pd_click}
