  layout_properties: {grid_position: 'NPPRNB,FECQJB'}
  name: column_panel_1
  properties: 
    background: '#f5f0e6'
    spacing: medium
    padding: 20
  type: ColumnPanel
container: 
  type: ColumnPanel
  properties:
    background: '#f5f0e6'
is_package: true
